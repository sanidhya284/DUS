events {
  worker_processes auto;
}

http {
  # Rate limiting zone — 10 MB shared memory, 10 req/s burst
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=redirect:10m rate=50r/s;

  upstream dus_api {
    least_conn;
    server api1:3000;
    server api2:3000;
    # Add more API nodes here for horizontal scaling
  }

  server {
    listen 80;
    server_name _;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name dus.io;

    ssl_certificate     /etc/ssl/certs/dus.crt;
    ssl_certificate_key /etc/ssl/private/dus.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Forward real IP
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # API routes
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://dus_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
    }

    # Health check (no rate limit)
    location /health {
      proxy_pass http://dus_api;
      proxy_set_header Host $host;
    }

    # Short code redirects (critical path)
    location ~* ^/[a-zA-Z0-9-]{1,32}$ {
      limit_req zone=redirect burst=100 nodelay;
      proxy_pass http://dus_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }
  }
}
